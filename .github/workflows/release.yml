name: Release

on:
  push:
    tags:
      - "v*"

# Needed for softprops/action-gh-release to create the GitHub Release.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build + publish linux x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Gate the release on the same checks as CI — never publish a binary that
      # doesn't pass clippy/tests.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Release build
        run: cargo build --release

      # ubuntu-latest is x86_64/glibc — the OCI E2.1.Micro deploy target.
      - name: Package
        run: |
          cd target/release
          asset="igbot-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -czf "$asset" igbot
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/igbot-${{ github.ref_name }}-linux-x86_64.tar.gz
            target/release/igbot-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
